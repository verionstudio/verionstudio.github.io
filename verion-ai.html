<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRION.AI | VÉRION STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #090909;
    color: #f5f2ec;
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

header {
    flex-shrink: 0;
    background: rgba(9, 9, 9, 0.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(200, 168, 120, 0.22);
}

.nav-wrap {
    width: min(1200px, 94%);
    margin: auto;
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 22px;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    letter-spacing: 2px;
    color: #e1c69b;
    text-decoration: none;
    white-space: nowrap;
}

nav {
    display: flex;
    align-items: center;
}

nav a {
    font-size: .72rem;
    letter-spacing: 1px;
    color: #a99b83;
    text-decoration: none;
    transition: 0.25s;
    white-space: nowrap;
}

nav a:hover {
    color: #e1c69b;
}

/* Fullscreen Chat Layout */
.chat-main {
    flex: 1;
    min-height: 0;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

.chat-header-bar {
    flex-shrink: 0;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(200, 168, 120, 0.15);
    background: #090909;
}

.chat-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: #e1c69b;
    letter-spacing: 1px;
}

.mode-badge {
    font-size: .65rem;
    letter-spacing: 2px;
    background: rgba(200, 168, 120, 0.1);
    color: #e1c69b;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid rgba(200, 168, 120, 0.22);
    white-space: nowrap;
}

.message-log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
}

.message-log::-webkit-scrollbar {
    width: 5px;
}
.message-log::-webkit-scrollbar-thumb {
    background: #222;
    border-radius: 3px;
}

.chat-bubble {
    padding: 16px 20px;
    border-radius: 12px;
    font-size: .92rem;
    line-height: 1.6;
    max-width: 82%;
    white-space: pre-wrap;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}

.chat-bubble.ai {
    background: #111111;
    border: 1px solid rgba(200, 168, 120, 0.18);
    color: #f5f2ec;
    align-self: flex-start;
}

.chat-bubble.user {
    background: #c8a878;
    color: #090909;
    align-self: flex-end;
    font-weight: 500;
}

.input-container {
    flex-shrink: 0;
    padding: 20px 24px;
    background: #090909;
    border-top: 1px solid rgba(200, 168, 120, 0.22);
    display: flex;
    gap: 12px;
    align-items: center;
}

input {
    flex: 1;
    min-width: 0;
    background: #111111;
    border: 1px solid rgba(200, 168, 120, 0.25);
    border-radius: 12px;
    outline: none;
    color: #f5f2ec;
    padding: 15px 18px;
    font-size: .92rem;
    font-family: 'DM Sans', sans-serif;
    transition: 0.25s;
}

input:focus {
    border-color: #c8a878;
}

button {
    flex-shrink: 0;
    background: #c8a878;
    border: none;
    padding: 0 28px;
    height: 50px;
    color: #090909;
    border-radius: 12px;
    font-weight: 600;
    font-size: .78rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.25s;
    text-transform: uppercase;
}

button:hover {
    background: #e1c69b;
}

button:disabled, input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

@media (max-width: 420px) {
    .logo { font-size: 1.05rem; }
    nav a { font-size: .65rem; }
}
</style>
</head>

<body>

<header>
    <div class="nav-wrap">
        <a href="index.html" class="logo">VÉRION STUDIO</a>
        <nav>
            <a href="index.html">← BACK TO HOME</a>
        </nav>
    </div>
</header>
    
<main class="chat-main">
    <div class="chat-header-bar">
        <span class="chat-title">VÉRION.AI Intelligence</span>
        <span class="mode-badge" id="modeBadge">GENERAL</span>
    </div>

    <div class="message-log" id="messageLog">
        <div class="chat-bubble ai">Welcome to VÉRION.AI. How can I assist your creative vision today?</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask anything or describe your project..." autofocus>
        <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
</main>

<script>
    const WORKER_URL = "https://verion-ai.verionstudio.workers.dev";
    let currentMode = "general";

    window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const mode = params.get("mode");
        const input = document.getElementById("userInput");
        const badge = document.getElementById("modeBadge");

        if (mode === "script") {
            currentMode = "script";
            input.placeholder = "Describe your video topic or product...";
            badge.innerText = "SCRIPT GENERATOR";
        } else if (mode === "caption") {
            currentMode = "caption";
            input.placeholder = "Describe what your post is about...";
            badge.innerText = "CAPTION GENERATOR";
        } else if (mode === "ideas") {
            currentMode = "ideas";
            input.placeholder = "Enter your niche or industry...";
            badge.innerText = "CONTENT IDEAS";
        } else if (mode === "roadmap") {
            currentMode = "roadmap";
            input.placeholder = "Enter your platform and current level...";
            badge.innerText = "GROWTH ROADMAPS";
        }
        input.focus();
    });

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messageLog = document.getElementById("messageLog");
        const sendBtn = document.getElementById("sendBtn");
        
        const text = input.value.trim();
        if (!text) return;

        const userBubble = document.createElement("div");
        userBubble.className = "chat-bubble user";
        userBubble.innerText = text;
        messageLog.appendChild(userBubble);

        input.value = "";
        messageLog.scrollTop = messageLog.scrollHeight;

        input.disabled = true;
        sendBtn.disabled = true;

        const aiBubble = document.createElement("div");
        aiBubble.className = "chat-bubble ai";
        aiBubble.innerText = "Thinking...";
        messageLog.appendChild(aiBubble);
        messageLog.scrollTop = messageLog.scrollHeight;

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text, mode: currentMode })
            });

            const data = await response.json();
            if (data.reply) {
                aiBubble.innerText = data.reply;
            } else {
                aiBubble.innerText = "VÉRION.AI encountered an issue. Please try again.";
            }
        } catch (err) {
            aiBubble.innerText = "Connection error. Please check your network or worker status.";
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            messageLog.scrollTop = messageLog.scrollHeight;
        }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
