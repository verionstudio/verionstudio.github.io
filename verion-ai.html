<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>VÉRION.AI | Creative Intelligence</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #090909;
  --surface: #111111;
  --surface2: #171717;
  --gold: #c8a878;
  --gold-light: #e1c69b;
  --white: #f5f2ec;
  --muted: #a09a90;
  --border: rgba(200,168,120,.22);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Sans', sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

a { color: inherit; text-decoration: none; }

/* HEADER */
header {
  background: rgba(9,9,9,.94);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.nav-wrap {
  width: min(1200px, 94%);
  margin: auto;
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  letter-spacing: 2px;
  color: var(--gold-light);
  white-space: nowrap;
}

nav {
  display: flex;
  align-items: center;
  gap: 20px;
}

nav a {
  font-size: .72rem;
  letter-spacing: 1px;
  color: #c3beb5;
  text-transform: uppercase;
  transition: .25s;
}

nav a:hover { color: var(--gold-light); }

/* MODE BAR */
.mode-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  flex-shrink: 0;
}

.mode-wrap {
  width: min(960px, 94%);
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.mode-pills {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}

.mode-pills::-webkit-scrollbar { display: none; }

.mode-pill {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 6px 14px;
  font-size: .68rem;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  transition: .2s;
  font-family: inherit;
}

.mode-pill:hover {
  border-color: var(--gold);
  color: var(--gold-light);
}

.mode-pill.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #090909;
  font-weight: 600;
}

.clear-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: .7rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  font-family: inherit;
}

.clear-btn:hover { color: var(--gold-light); }

/* CHAT AREA */
.chat-wrapper {
  flex: 1;
  width: min(960px, 94%);
  margin: auto;
  display: flex;
  flex-direction: column;
  padding: 18px 0 20px;
  overflow: hidden;
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-right: 6px;
  margin-bottom: 16px;
}

.chat-box::-webkit-scrollbar { width: 5px; }
.chat-box::-webkit-scrollbar-thumb { background: var(--border); }

.message {
  padding: 16px 20px;
  font-size: .92rem;
  line-height: 1.65;
  max-width: 84%;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.message.ai {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--white);
  align-self: flex-start;
}

.message.user {
  background: var(--gold);
  color: #090909;
  align-self: flex-end;
  font-weight: 500;
}

.message.error {
  background: rgba(200, 70, 70, 0.12);
  border: 1px solid rgba(200, 70, 70, 0.45);
  color: #f2b8b5;
  align-self: flex-start;
}

/* INPUT FORM */
.chat-form {
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}

.chat-form input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 15px 18px;
  color: var(--white);
  font-family: inherit;
  font-size: .95rem;
  outline: none;
  transition: .25s;
}

.chat-form input:focus { border-color: var(--gold-light); }
.chat-form input::placeholder { color: #777; }

.chat-form button {
  padding: 0 26px;
  background: var(--gold);
  border: 1px solid var(--gold);
  color: #090909;
  font-family: inherit;
  font-size: .76rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: .25s;
}

.chat-form button:hover:not(:disabled) { background: var(--gold-light); }
.chat-form button:disabled { opacity: .5; cursor: not-allowed; }

@media (max-width: 640px) {
  .message { max-width: 94%; font-size: .88rem; }
  .chat-form button { padding: 0 18px; }
}
</style>
</head>
<body>

<header>
  <div class="nav-wrap">
    <a href="index.html" class="logo">VÉRION.AI</a>
    <nav>
      <a href="index.html">← BACK TO STUDIO</a>
    </nav>
  </div>
</header>

<div class="mode-bar">
  <div class="mode-wrap">
    <div class="mode-pills" id="modePills">
      <button class="mode-pill active" data-mode="general" onclick="setMode('general')">General AI</button>
      <button class="mode-pill" data-mode="script" onclick="setMode('script')">Script Generator</button>
      <button class="mode-pill" data-mode="caption" onclick="setMode('caption')">Caption Generator</button>
      <button class="mode-pill" data-mode="ideas" onclick="setMode('ideas')">Content Ideas</button>
      <button class="mode-pill" data-mode="roadmap" onclick="setMode('roadmap')">Growth Roadmaps</button>
    </div>
    <button class="clear-btn" onclick="resetChat()">New Chat</button>
  </div>
</div>

<div class="chat-wrapper">
  <div class="chat-box" id="chatBox"></div>

  <form class="chat-form" id="chatForm" onsubmit="handleSend(event)">
    <input
      type="text"
      id="userInput"
      placeholder="Ask VÉRION.AI anything..."
      autocomplete="off"
      autofocus
    >
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
// Connected to your Cloudflare Worker URL
const WORKER_URL = "https://verion-ai.verionstudio.workers.dev";

const MODE_CONFIG = {
  general: {
    welcome: "Welcome to VÉRION.AI. Ask questions, brainstorm ideas, or get creative assistance.",
    placeholder: "Ask VÉRION.AI anything..."
  },
  script: {
    welcome: "Script Generator active. Share your product, brand, or video topic—I'll write a cinematic script with hooks, camera direction, and voiceover.",
    placeholder: "Describe the product or ad concept for your script..."
  },
  caption: {
    welcome: "Caption Generator active. Tell me what your post is about—I'll craft luxury-toned captions and strategic hashtags.",
    placeholder: "Describe your photo, reel, or campaign..."
  },
  ideas: {
    welcome: "Content Ideas active. Share your niche or brand—I'll generate viral-ready content concepts and hooks.",
    placeholder: "Enter your niche, brand, or target audience..."
  },
  roadmap: {
    welcome: "Growth Roadmaps active. Tell me your brand and goal—I'll map out a 30-day strategic execution plan.",
    placeholder: "e.g., Launch a luxury fragrance brand on Instagram..."
  }
};

let currentMode = "general";
let conversationHistory = [];
let isGenerating = false;

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function appendMessage(text, type) {
  const div = document.createElement("div");
  div.className = `message ${type}`;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function setMode(mode, skipReset = false) {
  currentMode = MODE_CONFIG[mode] ? mode : "general";

  document.querySelectorAll(".mode-pill").forEach((pill) => {
    pill.classList.toggle("active", pill.dataset.mode === currentMode);
  });

  userInput.placeholder = MODE_CONFIG[currentMode].placeholder;

  if (!skipReset) {
    conversationHistory = [];
    chatBox.innerHTML = "";
    appendMessage(MODE_CONFIG[currentMode].welcome, "ai");
  }
}

function resetChat() {
  setMode(currentMode, false);
}

async function sendPromptToWorker(text) {
  if (isGenerating) return;
  isGenerating = true;
  sendBtn.disabled = true;

  appendMessage(text, "user");
  conversationHistory.push({ role: "user", content: text });

  const thinkingEl = appendMessage("Thinking...", "ai");

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: currentMode,
        messages: conversationHistory
      })
    });

    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(data.error || "Failed to connect to VÉRION.AI server.");
    }

    thinkingEl.textContent = data.reply;
    conversationHistory.push({ role: "assistant", content: data.reply });
  } catch (err) {
    thinkingEl.className = "message error";
    thinkingEl.textContent = "Error: " + err.message;
  } finally {
    isGenerating = false;
    sendBtn.disabled = false;
    userInput.focus();
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

function handleSend(event) {
  event.preventDefault();
  const text = userInput.value.trim();
  if (!text || isGenerating) return;
  userInput.value = "";
  sendPromptToWorker(text);
}

(function init() {
  const params = new URLSearchParams(window.location.search);
  const urlMode = params.get("mode") || "general";
  const urlPrompt = params.get("prompt");

  setMode(urlMode, false);

  if (urlPrompt && urlPrompt.trim()) {
    sendPromptToWorker(urlPrompt.trim());
  }
})();
</script>

</body>
</html>
