<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRION.AI | VÉRION STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #060606;
    color: #f2eee3;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 22px 6%;
    border-bottom: 1px solid rgba(216, 189, 136, 0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(6, 6, 6, 0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-family: 'Playfair Display', serif;
    color: #d8bd88;
    font-size: 20px;
    letter-spacing: 3px;
    text-decoration: none;
}

nav a {
    color: #bda477;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: 0.2s;
}

nav a:hover {
    color: #f2eee3;
}

main {
    max-width: 800px;
    width: 90%;
    margin: 40px auto;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.chat-container {
    background: #0e0e0d;
    border: 1px solid rgba(216, 189, 136, 0.2);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    height: 70vh;
    min-height: 500px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    overflow: hidden;
}

.chat-header {
    padding: 20px 24px;
    border-bottom: 1px solid rgba(216, 189, 136, 0.12);
    background: #121211;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chat-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: #d8bd88;
}

.mode-badge {
    font-size: 10px;
    letter-spacing: 1.5px;
    background: rgba(216, 189, 136, 0.1);
    color: #d8bd88;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(216, 189, 136, 0.2);
}

.message-log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
}

.message-log::-webkit-scrollbar {
    width: 6px;
}
.message-log::-webkit-scrollbar-thumb {
    background: #2a251d;
    border-radius: 3px;
}

.chat-bubble {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 85%;
    white-space: pre-wrap;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}

.chat-bubble.ai {
    background: #171614;
    border: 1px solid rgba(216, 189, 136, 0.15);
    color: #f2eee3;
    align-self: flex-start;
}

.chat-bubble.user {
    background: #d8bd88;
    color: #0e0e0d;
    align-self: flex-end;
    font-weight: 500;
}

.input-area {
    padding: 16px 20px;
    background: #121211;
    border-top: 1px solid rgba(216, 189, 136, 0.12);
    display: flex;
    gap: 12px;
    align-items: center;
}

input {
    flex: 1;
    background: #060606;
    border: 1px solid rgba(216, 189, 136, 0.25);
    border-radius: 10px;
    outline: none;
    color: #f2eee3;
    padding: 14px 16px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    transition: 0.2s;
}

input:focus {
    border-color: #d8bd88;
}

button {
    background: #d8bd88;
    border: none;
    padding: 0 24px;
    height: 47px;
    color: #0e0e0d;
    border-radius: 10px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #e2cca1;
}

button:disabled, input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

footer {
    text-align: center;
    padding: 30px;
    color: #665f52;
    font-size: 11px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">VÉRION STUDIO</a>
    <nav>
        <a href="index.html">← HOME</a>
    </nav>
</header>
    
<main>
    <div class="chat-container">
        <div class="chat-header">
            <span class="chat-title">VÉRION.AI Intelligence</span>
            <span class="mode-badge" id="modeBadge">GENERAL</span>
        </div>

        <div class="message-log" id="messageLog">
            <div class="chat-bubble ai">Welcome to VÉRION.AI. How can I assist your creative vision today?</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything or describe your project..." autofocus>
            <button id="sendBtn" onclick="sendMessage()">SEND</button>
        </div>
    </div>
</main>

<footer>
    VÉRION STUDIO · ALL RIGHTS RESERVED
</footer>

<script>
    const WORKER_URL = "https://verion-ai.verionstudio.workers.dev";
    let currentMode = "general";

    // Auto-detect mode if coming from shortcuts on index.html
    window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const mode = params.get("mode");
        const input = document.getElementById("userInput");
        const badge = document.getElementById("modeBadge");

        if (mode === "script") {
            currentMode = "script";
            input.value = "Write a commercial video ad script about: ";
            badge.innerText = "SCRIPT GENERATOR";
        } else if (mode === "caption") {
            currentMode = "caption";
            input.value = "Write 3 luxury social media captions for: ";
            badge.innerText = "CAPTION GENERATOR";
        } else if (mode === "ideas") {
            currentMode = "ideas";
            input.value = "Give me 5 creative content concepts for: ";
            badge.innerText = "CONTENT IDEAS";
        } else if (mode === "roadmap") {
            currentMode = "roadmap";
            input.value = "Build a 30-day audience growth roadmap for: ";
            badge.innerText = "GROWTH ROADMAPS";
        }
        input.focus();
    });

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messageLog = document.getElementById("messageLog");
        const sendBtn = document.getElementById("sendBtn");
        
        const text = input.value.trim();
        if (!text) return;

        const userBubble = document.createElement("div");
        userBubble.className = "chat-bubble user";
        userBubble.innerText = text;
        messageLog.appendChild(userBubble);

        input.value = "";
        messageLog.scrollTop = messageLog.scrollHeight;

        input.disabled = true;
        sendBtn.disabled = true;

        const aiBubble = document.createElement("div");
        aiBubble.className = "chat-bubble ai";
        aiBubble.innerText = "Thinking...";
        messageLog.appendChild(aiBubble);
        messageLog.scrollTop = messageLog.scrollHeight;

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: text, mode: currentMode })
            });

            const data = await response.json();
            if (data.reply) {
                aiBubble.innerText = data.reply;
            } else {
                aiBubble.innerText = "VÉRION.AI encountered an issue. Please try again.";
            }
        } catch (err) {
            aiBubble.innerText = "Connection error. Please check your network or worker status.";
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
            messageLog.scrollTop = messageLog.scrollHeight;
        }
    }

    document.getElementById("userInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
