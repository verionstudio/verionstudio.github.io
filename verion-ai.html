<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VÉRION.AI | Intelligent Studio Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #090909;
    --bg-card: #111111;
    --gold: #c8a878;
    --gold-light: #e1c69b;
    --text: #f5f2ec;
    --text-muted: #c3beb5;
    --border: rgba(200, 168, 120, 0.22);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* HEADER */
header {
    background: rgba(9, 9, 9, 0.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
}

.nav-wrap {
    width: min(1200px, 94%);
    margin: auto;
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    letter-spacing: 2px;
    color: var(--gold-light);
    text-decoration: none;
}

nav a {
    font-size: .72rem;
    letter-spacing: 1px;
    color: var(--text-muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: .25s;
}

nav a:hover {
    color: var(--gold-light);
}

/* CHAT CONTAINER */
.chat-container {
    flex: 1;
    width: min(900px, 94%);
    margin: auto;
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    max-height: calc(100vh - 100px);
}

.chat-box {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 20px;
}

.message {
    padding: 14px 18px;
    font-size: .92rem;
    max-width: 80%;
    line-height: 1.5;
}

.message.ai {
    background: rgba(200, 168, 120, 0.08);
    border: 1px solid var(--border);
    color: var(--text);
    align-self: flex-start;
}

.message.user {
    background: var(--gold);
    color: #090909;
    align-self: flex-end;
    font-weight: 500;
}

/* INPUT AREA */
.chat-input-area {
    display: flex;
    gap: 12px;
}

.chat-input-area input {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 14px 18px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: .95rem;
    outline: none;
    transition: .25s;
}

.chat-input-area input:focus {
    border-color: var(--gold-light);
}

.chat-input-area button {
    background: var(--gold);
    color: #090909;
    border: none;
    padding: 0 28px;
    font-size: .75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
}

.chat-input-area button:hover {
    background: var(--gold-light);
}
</style>
</head>
<body>

<header>
    <div class="nav-wrap">
        <a href="index.html" class="logo">VÉRION STUDIO</a>
        <nav>
            <a href="index.html">← BACK TO HOME</a>
        </nav>
    </div>
</header>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai">Welcome to VÉRION.AI. How can I assist you with your content strategy or creative scripting today?</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your message or prompt here..." autofocus>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function sendMessage() {
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const text = input.value.trim();

    if (!text) return;

    // Append User Message
    const userMsg = document.createElement('div');
    userMsg.className = 'message user';
    userMsg.textContent = text;
    chatBox.appendChild(userMsg);

    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Simulate AI Response
    setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message ai';
        aiMsg.textContent = "I've processed your request. Let's build out this creative concept for your brand.";
        chatBox.appendChild(aiMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }, 800);
}

document.getElementById('userInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        sendMessage();
    }
});
</script>

</body>
</html>
